<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>學校儀容違規登記系統 v1.4</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; color: #333; padding: 20px; display: flex; justify-content: center; }
        .box { background: #ffffff; padding: 30px; border-radius: 12px; max-width: 650px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.08); border: 1px solid #e1e4e8; position: relative; }
        h2 { text-align: center; color: #1a73e8; margin-bottom: 20px; }
        .top-badge { position: absolute; top: 15px; right: 20px; background-color: #e8f0fe; color: #1a73e8; padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; display: none; }
        .step-panel { display: none; }
        .step-panel.active { display: block; }
        .field { margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; font-size: 16px; font-weight: 600; }
        input[type="text"] { width: 100%; padding: 14px; background: #f8f9fa; border: 1.5px solid #dadce0; font-size: 18px; border-radius: 6px; box-sizing: border-box; }
        input[type="text"]:focus { border-color: #1a73e8; background: #ffffff; outline: none; }
        
        .menu-list { background: #f1f3f4; padding: 14px; border-radius: 6px; font-size: 14px; margin-bottom: 15px; line-height: 1.6; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
        
        .menu-item { background: #ffffff; padding: 12px; border-radius: 6px; border: 1px solid #dadce0; cursor: pointer; transition: all 0.2s ease; font-weight: 500; text-align: center; }
        .menu-item:hover { background-color: #f8f9fa; border-color: #bcaaa4; }
        .menu-item.selected { background-color: #e6f4ea !important; color: #137333 !important; border-color: #34a853 !important; font-weight: bold; box-shadow: 0 2px 6px rgba(52,168,83,0.15); }
        
        .pagination-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px solid #dadce0; }
        .page-btn { background-color: #ffffff; border: 1px solid #dadce0; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; color: #1a73e8; }
        .page-btn:hover:not(:disabled) { background-color: #e8f0fe; }
        .page-btn:disabled { color: #ccc; border-color: #eee; cursor: not-allowed; }
        .page-info { font-size: 13px; color: #5f6368; font-weight: bold; }

        .confirm-card { background: #f8f9fa; border: 1px solid #dadce0; border-radius: 8px; padding: 15px; margin-bottom: 20px; font-size: 16px; line-height: 1.8; }
        .confirm-item { display: flex; border-bottom: 1px dashed #e0e0e0; padding: 6px 0; }
        .confirm-item:last-child { border-bottom: none; }
        .confirm-label { width: 110px; color: #5f6368; font-weight: bold; }
        .confirm-value { color: #202124; font-weight: 500; }
        .time-highlight { color: #b06000; font-weight: bold; }
        
        .btn-group { display: flex; gap: 15px; margin-top: 15px; }
        .btn { flex: 1; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; border: none; text-align: center; }
        
        .btn-logout { background-color: #ea4335; color: white; }
        .btn-logout:hover { background-color: #d93025; }
        
        .btn-back { background-color: #1a73e8; color: white; }
        .btn-back:hover { background-color: #1557b0; }
        
        .btn-continue, .btn-submit { background-color: #34a853; color: white; }
        .btn-continue:hover, .btn-submit:hover { background-color: #2b8c44; }
        
        .confirm-card + .btn-group .btn-back { background-color: #1a73e8; color: white; border: none; }
        .confirm-card + .btn-group .btn-back:hover { background-color: #1557b0; }
        .confirm-card + .btn-group .btn-submit { background-color: #34a853; color: white; }
        .confirm-card + .btn-group .btn-submit:hover { background-color: #2b8c44; }

        .status { text-align: center; font-weight: bold; margin-top: 15px; font-size: 15px; padding: 12px; border-radius: 6px; display: none; }
        .status.loading { display: block; background: #fff7e6; color: #d46b08; border: 1px solid #ffd591; }
        .status.success { display: block; background: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
        .status.error { display: block; background: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; text-align: left; }
        .today-panel { margin-top: 24px; padding-top: 20px; border-top: 1px solid #dadce0; }
        .today-panel h3 { margin: 0 0 12px; color: #202124; font-size: 18px; }
        .today-btn { position: fixed; right: 24px; bottom: 24px; z-index: 10; display: block; padding: 12px 18px; background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
        .today-btn:hover { background: #1557b0; }
        .today-btn:disabled { background: #9aa0a6; cursor: wait; }
        .today-result { margin-top: 12px; overflow-x: auto; }
        .today-result table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .today-result th, .today-result td { padding: 8px 6px; border-bottom: 1px solid #e0e0e0; text-align: left; white-space: nowrap; }
        .today-result th { background: #f1f3f4; color: #5f6368; }
        .today-empty { color: #5f6368; text-align: center; padding: 12px; }
        .version-badge { position: fixed; left: 16px; bottom: 16px; z-index: 10; padding: 6px 10px; background: rgba(255,255,255,.9); color: #5f6368; border: 1px solid #dadce0; border-radius: 4px; font-size: 12px; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    </style>
</head>
<body>

<div class="box">
    <div id="topBadge" class="top-badge"></div>
    <h2>儀容違規登記系統 <small>v1.4</small></h2>
    
    <!-- 第一步 -->
    <div id="panelStep1" class="step-panel active">
        <div class="field">
            <label>【第一步】請拍卡 / 輸入編號 / 輸入班別學號(如1A01) ➔ 按 [Enter]</label>
            <input type="text" id="studentId" autofocus autocomplete="off" placeholder="系統正在加載試算表項目選單，請稍候..." disabled>
        </div>
    </div>

    <!-- 第二步：大項目 -->
    <div id="panelStep2" class="step-panel">
        <div class="menu-list">
            <strong>[校服儀容違規項目選單]</strong>
            <div class="menu-grid" id="mainMenuGrid"></div>
            <div class="pagination-bar">
                <button type="button" class="page-btn" id="btnPrevPage" onclick="changePage(-1)">◀ 上一頁</button>
                <span class="page-info" id="pageInfo">第 1 / 1 頁</span>
                <button type="button" class="page-btn" id="btnNextPage" onclick="changePage(1)">下一頁 ▶</button>
            </div>
        </div>
        <div class="field">
            <label>【第二步】輸入項目數字 或直接點選上方項目</label>
            <input type="text" id="projectNum" autocomplete="off" placeholder="輸入項目代碼">
        </div>
        <div class="btn-group">
            <button type="button" class="btn btn-logout" id="btnStep2Logout">登出</button>
            <button type="button" class="btn btn-continue" id="btnStep2Continue">繼續</button>
        </div>
    </div>

    <!-- 第三步：子類型 🌟（已支援自訂輸入文字） -->
    <div id="panelStep3" class="step-panel">
        <div id="menuType" class="menu-list"></div>
        <div class="field">
            <label id="lblStep3Title">【第三步】輸入類型數字 或直接點選上方項目</label>
            <input type="text" id="typeNum" autocomplete="off" placeholder="輸入類型代碼">
        </div>
        <div class="btn-group">
            <button type="button" class="btn btn-back" id="btnStep3Back">返回</button>
            <button type="button" class="btn btn-continue" id="btnStep3Continue">繼續</button>
        </div>
    </div>

    <!-- 第四步：核對提交 -->
    <div id="panelConfirm" class="step-panel">
        <label>【第四步】請核對資料是否正確：</label>
        <div class="confirm-card">
            <div class="confirm-item"><div class="confirm-label">登記時間：</div><div class="confirm-value time-highlight" id="lblTime">-</div></div>
            <div class="confirm-item"><div class="confirm-label">姓名：</div><div class="confirm-value" id="lblName">-</div></div>
            <div class="confirm-item"><div class="confirm-label">班別：</div><div class="confirm-value" id="lblClass">-</div></div>
            <div class="confirm-item"><div class="confirm-label">學號：</div><div class="confirm-value" id="lblId">-</div></div>
            <div class="confirm-item"><div class="confirm-label">違規項目：</div><div class="confirm-value" id="lblProject">-</div></div>
            <div class="confirm-item"><div class="confirm-label">違規類型：</div><div class="confirm-value" id="lblType">-</div></div>
        </div>
        <div class="btn-group">
            <button type="button" class="btn btn-back" id="btnBack">返回修改</button>
            <button type="button" class="btn btn-submit" id="btnSubmit">確認提交</button>
        </div>
    </div>

    <div id="statusMsg" class="status"></div>

    <button type="button" class="today-btn" id="btnTodayLogs">查看今日登記紀錄</button>
</div>
<div class="version-badge">v1.4.2</div>

<script>
    // ⚠️ 請確保引號內填寫的是你目前正在使用的有效 GAS 網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw6LFC2h7Fmz1uQPE7eH8pz5n11FQt_SS2q7F6aXJbN6ucmRXjGv6J4eJnV2aUoRAGg/exec";

    let violationMap = {};
    let currentStudent = { cardId: "", studentNum: "", name: "", studentClass: "", studentId: "" };
    let selectedProjectName = "";
    let selectedTypeName = "";
    let capturedTimeString = ""; 
    let hasTypes = false; 
    let isCustomTextMode = false; // 🌟 標記是否為自由文字輸入模式

    const ITEMS_PER_PAGE = 8;
    let currentPage = 1;
    let totalPages = 1;
    let menuKeysArray = [];

    const elId = document.getElementById('studentId');
    const elProj = document.getElementById('projectNum');
    const elType = document.getElementById('typeNum');
    const elStatus = document.getElementById('statusMsg');
    const elMenuType = document.getElementById('menuType');
    const elMainMenuGrid = document.getElementById('mainMenuGrid');
    const elTopBadge = document.getElementById('topBadge');
    const elStep3Title = document.getElementById('lblStep3Title');
    const startStep = new URLSearchParams(window.location.search).get('step');
    const editMainViolation = new URLSearchParams(window.location.search).get('mainViolation') || '';
    const editSubViolation = new URLSearchParams(window.location.search).get('subViolation') || '';
    const elTodayResult = document.getElementById('todayResult');
    const btnTodayLogs = document.getElementById('btnTodayLogs');

    const panels = { 1: document.getElementById('panelStep1'), 2: document.getElementById('panelStep2'), 3: document.getElementById('panelStep3'), 4: document.getElementById('panelConfirm') };

    function loadMenuFromSheet() {
        showStatus("⏳ 正在從 Google Sheet 同步項目選單...", "loading");
        fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: "getViolationMenu" }) })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                violationMap = data.menu;
                menuKeysArray = Object.keys(violationMap);
                totalPages = Math.ceil(menuKeysArray.length / ITEMS_PER_PAGE) || 1;
                
                renderMainMenuPage(1);
                clearStatus();
                elId.disabled = false;
                elId.placeholder = "等待拍卡或手動輸入...";
                if (startStep === "2") {
                    switchStep(2);
                    const matchingKey = Object.keys(violationMap).find(key => violationMap[key].name === editMainViolation);
                    if (matchingKey) {
                        elProj.value = matchingKey;
                        syncMainMenuHighlight(matchingKey, false);
                    }
                } else {
                    elId.focus();
                }
            } else { showStatus(`❌ 加載選單失敗！原因: ${data.message}`, "error"); }
        })
        .catch(err => showStatus(`❌ 無法連線試算表獲取選單！<br><small>${err.message}</small>`, "error"));
    }
    window.addEventListener('DOMContentLoaded', loadMenuFromSheet);

    function renderMainMenuPage(page) {
        currentPage = page;
        const startIndex = (page - 1) * ITEMS_PER_PAGE;
        const pageKeys = menuKeysArray.slice(startIndex, startIndex + ITEMS_PER_PAGE);
        
        let html = "";
        pageKeys.forEach(key => {
            html += `<div class="menu-item" id="main-item-${key}" onclick="clickMainMenu('${key}')"><b>${key}</b>. ${violationMap[key].name}</div>`;
        });
        elMainMenuGrid.innerHTML = html;

        document.getElementById('pageInfo').innerText = `第 ${currentPage} / ${totalPages} 頁`;
        document.getElementById('btnPrevPage').disabled = (currentPage === 1);
        document.getElementById('btnNextPage').disabled = (currentPage === totalPages);

        syncMainMenuHighlight(elProj.value.trim(), false);
    }

    function changePage(direction) {
        const newPage = currentPage + direction;
        if (newPage >= 1 && newPage <= totalPages) {
            renderMainMenuPage(newPage);
        }
    }

    function clickMainMenu(key) { 
        elProj.value = key; 
        syncMainMenuHighlight(key, false); 
    }

    function syncMainMenuHighlight(val, autoJumpPage = true) {
        if (!val) {
            document.querySelectorAll('#mainMenuGrid .menu-item').forEach(item => item.classList.remove('selected'));
            return;
        }

        if (autoJumpPage && violationMap[val]) {
            const itemIndex = menuKeysArray.indexOf(val);
            if (itemIndex !== -1) {
                const targetPage = Math.floor(itemIndex / ITEMS_PER_PAGE) + 1;
                if (targetPage !== currentPage) {
                    renderMainMenuPage(targetPage);
                }
            }
        }

        document.querySelectorAll('#mainMenuGrid .menu-item').forEach(item => item.classList.remove('selected'));
        const target = document.getElementById(`main-item-${val}`);
        if (target) { target.classList.add('selected'); }
    }

    function clickSubMenu(key) { elType.value = key; syncSubMenuHighlight(key); }
    function syncSubMenuHighlight(val) {
        if (isCustomTextMode) return; // 自由文字模式下不觸發選單高亮
        document.querySelectorAll('#menuType .menu-item').forEach(item => item.classList.remove('selected'));
        const target = document.getElementById(`sub-item-${val}`);
        if (target) { target.classList.add('selected'); }
    }

    function getFormattedTime() {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
    }

    function switchStep(stepNumber) {
        for (let key in panels) { if (panels[key]) panels[key].classList.remove('active'); }
        if (panels[stepNumber]) panels[stepNumber].classList.add('active');
        btnTodayLogs.style.display = stepNumber === 1 ? "block" : "none";
        if (stepNumber === 1) { elId.value = ""; elId.focus(); elTopBadge.style.display = "none"; currentStudent = { cardId: "", studentNum: "", name: "", studentClass: "", studentId: "" }; }
        if (stepNumber === 2) { elProj.value = ""; renderMainMenuPage(1); elProj.focus(); }
        if (stepNumber === 3) { elType.value = ""; elType.focus(); }
        if (stepNumber === 4) { document.getElementById('btnSubmit').focus(); }
    }

    function restoreEditSubViolation() {
        if (!editSubViolation) return;
        if (isCustomTextMode) {
            elType.value = editSubViolation;
            return;
        }
        const typeMap = violationMap[elProj.value].types || {};
        const matchingType = Object.keys(typeMap).find(key => typeMap[key] === editSubViolation);
        if (matchingType) {
            elType.value = matchingType;
            syncSubMenuHighlight(matchingType);
        }
    }

    function showStatus(text, className) { elStatus.className = "status " + className; elStatus.innerHTML = text; elStatus.style.display = "block"; }
    function clearStatus() { elStatus.className = "status"; elStatus.style.display = "none"; }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, character => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[character]));
    }

    function renderTodayLogs(logs) {
        if (!Array.isArray(logs) || logs.length === 0) {
            elTodayResult.innerHTML = '<div class="today-empty">今天暫時沒有登記紀錄。</div>';
            return;
        }

        const rows = logs.map(log => `<tr>
            <td>${escapeHtml(log.time || log.webTime || '')}</td>
            <td>${escapeHtml(log.studentClass || log.class || '')}</td>
            <td>${escapeHtml(log.studentId || log.studentNum || '')}</td>
            <td>${escapeHtml(log.name || '')}</td>
            <td>${escapeHtml(log.mainViolation || log.project || '')}</td>
            <td>${escapeHtml(log.subViolation || log.type || '')}</td>
        </tr>`).join('');

        elTodayResult.innerHTML = `<table>
            <thead><tr><th>時間</th><th>班別</th><th>學號</th><th>姓名</th><th>違規項目</th><th>違規類型</th></tr></thead>
            <tbody>${rows}</tbody>
        </table>`;
    }

    function loadTodayLogs() {
        btnTodayLogs.disabled = true;
        btnTodayLogs.innerText = '正在查詢 Logs...';
        elTodayResult.innerHTML = '<div class="today-empty">正在從 Google Sheet 的 Logs 查詢今天紀錄...</div>';

        fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: "getTodayLogs" }) })
            .then(async res => {
                const responseText = await res.text();
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                try { return JSON.parse(responseText); }
                catch (err) { throw new Error('後端尚未提供 getTodayLogs 動作，請更新 Apps Script'); }
            })
            .then(data => {
                if (data.status !== "success") throw new Error(data.message || data.msg || '無法讀取 Logs');
                renderTodayLogs(data.logs || data.records || []);
            })
            .catch(err => {
                elTodayResult.innerHTML = `<div class="today-empty">查詢失敗：${escapeHtml(err.message)}</div>`;
            })
            .finally(() => {
                btnTodayLogs.disabled = false;
                btnTodayLogs.innerText = '查看今日誰有登記';
            });
    }

    btnTodayLogs.addEventListener('click', function() {
        window.location.href = '今日登記紀錄.html';
    });

    function goToConfirmPage() {
        capturedTimeString = getFormattedTime();
        document.getElementById('lblTime').innerText = capturedTimeString; 
        document.getElementById('lblName').innerText = currentStudent.name;
        document.getElementById('lblClass').innerText = currentStudent.studentClass;
        document.getElementById('lblId').innerText = currentStudent.studentId;
        document.getElementById('lblProject').innerText = selectedProjectName;
        document.getElementById('lblType').innerText = selectedTypeName;
        switchStep(4);
    }

    // 🌟 處理第二步：項目選擇
    function processProjectSelection() {
        const val = elProj.value.trim();
        if (violationMap[val]) {
            clearStatus();
            selectedProjectName = violationMap[val].name;
            
            // 🌟 判斷 A：如果是「其他」（項目名稱含「其他」或子類型有定義）
            if (selectedProjectName.indexOf("其他") !== -1 && violationMap[val].types === null) {
                hasTypes = true;
                isCustomTextMode = true; // 開啟文字輸入模式
                elMenuType.innerHTML = `<strong>[其他 ── 請輸入違規細節描述]</strong><br><div style="margin-top:8px; color:#5f6368; font-size:13px;">可以在下方輸入框填寫具體原因，若不填寫將預設記錄為「其他」。</div>`;
                elStep3Title.innerText = "【第三步】請輸入違規細節內容（可留空）：";
                elType.placeholder = "請輸入細節";
                switchStep(3);
                restoreEditSubViolation();
            } 
            // 🌟 判斷 B：有子類型選單的普通項目
            else if (violationMap[val].types !== null) {
                hasTypes = true;
                isCustomTextMode = false;
                elStep3Title.innerText = "【第三步】輸入類型數字 或直接點選上方項目";
                elType.placeholder = "輸入類型代碼";
                
                let menuHtml = `<strong>[${violationMap[val].name} ── 子類型代碼選單]</strong><br><div class="menu-grid">`;
                for (let k in violationMap[val].types) { 
                    menuHtml += `<div class="menu-item" id="sub-item-${k}" onclick="clickSubMenu('${k}')"><b>${k}</b>. ${violationMap[val].types[k]}</div>`; 
                }
                menuHtml += `</div>`;
                elMenuType.innerHTML = menuHtml;
                switchStep(3); 
                restoreEditSubViolation();
            } 
            // 🌟 判斷 C：無子類型的普通項目
            else {
                hasTypes = false;
                isCustomTextMode = false;
                selectedTypeName = "N/A"; 
                goToConfirmPage();         
            }
        } else {
            showStatus("❌ 錯誤的項目代碼！請輸入選單中存在的有效數字。", "error");
            elProj.value = ""; syncMainMenuHighlight("", false); elProj.focus();
        }
    }

    // 🌟 處理第三步：類型選擇
    function processTypeSelection() {
        const projVal = elProj.value.trim();
        const typeVal = elType.value.trim();
        
        // 🌟 如果是「其他」的自訂文字模式
        if (isCustomTextMode) {
            clearStatus();
            // 有打字就用打字的內容，沒打字就預設為 "其他"
            selectedTypeName = typeVal !== "" ? typeVal : "其他";
            goToConfirmPage();
            return;
        }

        // 普通數字代碼驗證模式
        if (!violationMap[projVal] || !violationMap[projVal].types || !violationMap[projVal].types[typeVal]) {
            showStatus("❌ 錯誤的類型代碼！請檢查畫面上顯示的選項。", "error");
            elType.value = ""; syncSubMenuHighlight(""); elType.focus();
            return;
        }
        clearStatus();
        selectedTypeName = violationMap[projVal].types[typeVal];
        goToConfirmPage();
    }

    elId.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const id = elId.value.trim();
            if (!id) return;
            showStatus("⏳ 正在尋找學生資料...", "loading");
            fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: "searchStudent", studentId: id }) })
            .then(res => res.json())
            .then(data => {
                if (data.status === "found") {
                    currentStudent = data; 
                    clearStatus();
                    elTopBadge.innerText = `${currentStudent.name} ${currentStudent.studentClass}${currentStudent.studentId}`;
                    elTopBadge.style.display = "block";
                    switchStep(2); 
                } else {
                    showStatus("❌ 找不到此資料！請確認卡號、編號或班別座號(如1A01)是否正確。", "error");
                    elId.select();
                }
            }).catch(err => showStatus(`❌ 連線失敗！<br><small>${err.message}</small>`, "error"));
        }
    });

    elProj.addEventListener('input', function() { syncMainMenuHighlight(elProj.value.trim(), true); });
    elProj.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); processProjectSelection(); } });
    document.getElementById('btnStep2Logout').addEventListener('click', function() { clearStatus(); switchStep(1); });
    document.getElementById('btnStep2Continue').addEventListener('click', function() { processProjectSelection(); });

    elType.addEventListener('input', function() { syncSubMenuHighlight(elType.value.trim()); });
    elType.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); processTypeSelection(); } });
    document.getElementById('btnStep3Back').addEventListener('click', function() { clearStatus(); switchStep(2); });
    document.getElementById('btnStep3Continue').addEventListener('click', function() { processTypeSelection(); });

    document.getElementById('btnBack').addEventListener('click', function() { switchStep(hasTypes ? 3 : 2); });
    document.getElementById('btnSubmit').addEventListener('click', function() {
        const submitButton = this;
        submitButton.disabled = true;
        showStatus("⏳ 正在提交至試算表...", "loading");
        const payload = {
            action: "saveLog",
            cardId: String(currentStudent.cardId),
            studentNum: String(currentStudent.studentNum),
            name: String(currentStudent.name),
            studentClass: String(currentStudent.studentClass),
            studentId: String(currentStudent.studentId),
            webTime: capturedTimeString, 
            mainViolation: selectedProjectName,  
            subViolation: selectedTypeName       
        };
        fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) })
        .then(async res => {
            const responseText = await res.text();
            if (!res.ok) {
                throw new Error(`HTTP ${res.status}: ${responseText.slice(0, 300)}`);
            }
            try {
                return JSON.parse(responseText);
            } catch (err) {
                throw new Error(`GAS 回應不是 JSON：${responseText.slice(0, 300)}`);
            }
        })
        .then(data => {
            if (data.status === "success") {
                const sName = currentStudent.name;
                const sClass = currentStudent.studentClass;
                switchStep(1);
                showStatus(`✅ 提交成功 (${sClass} ${sName})`, "success");
                setTimeout(clearStatus, 3000);
            } else { showStatus(`❌ 提交失敗！原因：${data.message || '後台拒絕'}`, "error"); }
        })
        .catch(err => showStatus(`❌ 網路發送異常！<br><b>偵錯資訊：</b>${err.message}`, "error"))
        .finally(() => { submitButton.disabled = false; });
    });
</script>
